# Resources for rules
get_fasta_from_parquet:
  threads: 16
  mem_mb: 100000
  runtime: 60

hmmsearch:
  thresh_score: 30  # Only keep hits with score greater than or equal to
  threads: 8
  mem_mb: 10000
  runtime: 60

cluster_db_seqs:
  min_seq_id: "0.50" # In quotes for better filenaming
  coverage: "0.75" # In quotes for better filenaming
  cov_mode: 0
  threads: 32
  mem_mb: 100000
  runtime: 60

subset_db_clusts:
  pct: "100"  # in percentage points so to subset 10% give "10"

subset_db_outgroups:
  number: 100  # Number of seqs to use in total from outgroup genes

alignment:
  threads: 16
  mem_mb: 100000
  runtime: 60

trim_alignment_gappy_columns:
  gaps: 0.9
  mode: kpic-gappy
  threads: 4
  mem_mb: 10000
  runtime: 30

filter_alignment:
  frac_thresh: 0.25  # sequence must be at least this fraction of the mean long to be kept for backbone tree construction
  frac_thresh_short: 0.1  # same for env/exp tree placement
  threads: 8
  mem_mb: 10000
  runtime: 30

group_env_stuff:
  threads: 4
  mem_mb: 10000
  runtime: 30

cluster_env_hitseqs:
  min_seq_id: "0.90" # In quotes for better filenaming
  coverage: "0.50" # In quotes for better filenaming
  cov_mode: 1
  threads: 1
  mem_mb: 2000
  runtime: 60

cluster_exp_hitseqs:
  min_seq_id: "0.95" # In quotes for better filenaming
  coverage: "0.50" # In quotes for better filenaming
  cov_mode: 1
  threads: 1
  mem_mb: 2000
  runtime: 60

build_alignment_hmm:
  threads: 8
  mem_mb: 10000
  runtime: 60

deduplicate_alignment:
  mem_mb: 10000

fasttree_bootstraps:
  n_bootstraps: 100
  threads: 1
  runtime: 30
  mem_mb: 1000

fasttree:
  threads: 8
  mem_mb: 10000
  runtime: 120

roguenarok:
  threads: 8
  mem_mb: 10000
  runtime: 120
  frac_of_improvement_to_use: 0.9  # If removing all of the rogues gives improvement of 1, what fraction of that improvement do you want. Default mode "elbow" finds the elbow of the curve (where diminishing returns start).

build_tree:
  threads: 60
  mem_mb: 10000
  runtime: 2800
  seed: 42
  model: LG+G+FC
  model_old: PROTGAMMALGF
  n_bootstraps: "autoMRE{100}"  # For automatic number of bootstraps use autoMR/autoMRE/autoMRE_IGN
  n_bootstraps_extra: "autoMRE"
  n_trees_extra: "pars{50},rand{50}"
  seed_extra: 69

tree_placement:
  threads: 2
  mem_mb: 100000
  runtime: 480

get_bioproject_reads:
  threads: 8
  mem_mb: 10000
  runtime: 240

trim: 
  threads: 4

salmon:
  threads: 8
  mem_mb: 10000
  runtime: 240
  index:
    threads: 16
    mem_mb: 100000
    runtime: 600
  merge:
    threads: 16
    mem_mb: 100000
    runtime: 120

cluster_counts:
  threads: 4
  mem_mb: 10000
  runtime: 60

deseq:
  threads: 4
  mem_mb: 10000
  runtime: 120
  min_sum_counts: 10


