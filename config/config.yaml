build_barnacle_tidy:
  fn_metadata: /scratch/bgrodner/metaT_data/old_pipeline_chris_parquets/metadata.csv
  batches_to_run: [
      "G1PA",
      "G2PA",
      "G3PA.UW",
  ]
  contig_colname: target_id
  target_gene_name: FBP1
  dict_tax_include:
    phylum: ["Bacillariophyta", "Haptophyta", "Chlorophyta"]
    class: ["Pelagophyceae", "Dinophyceae"]
  ko_colname: KO
  counts_colname: counts

  new_tax_colname: taxname

  sum_exclude_cols: [
          "taxid", "domain", "kingdom", "phylum", "class", "order", 
          "family", "genus", "species", "KO", "KO_definition","score", 
          "target_id_right", "contig_name_6tr", "target_id", "taxname",
          "length"
      ]


  values_merge_colname: kallisto_fn
  meta_merge_colname: kallisto_fn
  metadata_columns: [
    "kallisto_fn","SampleID", "NORM_FACTOR", "batch_meta"
  ]

  sample_filt_rep_colname: SampleID
  sample_filt_rep_regex: '^(?P<sample>.+)\.(?P<filt>0\.2um|3um)\.(?P<rep>\w)$'
  sample_colname: sample
  filt_colname: filt
  rep_colname: rep
  norm_colname: NORM_FACTOR
  trl_colname: transcripts_per_liter

  batch_colname: batch_meta