    taxname: "Phaeodactylum tricornutum"
    method_assembly: download
    link_assembly: "https://ftp.ebi.ac.uk/ensemblgenomes/pub/protists/current/fasta/phaeodactylum_tricornutum/cds/Phaeodactylum_tricornutum.ASM15095v2.cds.all.fa.gz"
    method_counts: salmon-srr
    srrs: [
        "SRR23545486","SRR23545485","SRR23545483","SRR23545482","SRR23545487","SRR23545480", # Fe replete
        "SRR23545522","SRR23545521","SRR23545520","SRR23545519","SRR23545518","SRR23545516", # 3D starve
        "SRR23545503","SRR23545502","SRR23545501","SRR23545500","SRR23545499","SRR23545498", # 7D
        "SRR23545529","SRR23545528","SRR23545517","SRR23545506","SRR23545495","SRR23545484", # 2Weeks
